<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#456176"/>
      <stop offset="100%" stop-color="#26333f"/>
    </linearGradient>
    <linearGradient id="note" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#eef5fa"/>
      <stop offset="100%" stop-color="#c3d9e6"/>
    </linearGradient>
    <!-- 圆角方块裁剪：装饰元素不能溢出图标边界 -->
    <clipPath id="clip">
      <rect width="100" height="100" rx="117.76"/>
    </clipPath>
  </defs>

  <rect width="100" height="100" rx="117.76" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- 内侧柔光：位置收进来并降低不透明度，避免在大圆角处形成一圈亮边 -->
    <circle cx="68" cy="34" r="22" fill="#6fd0e6" opacity="0.10"/>

    <!-- 符干 -->
    <rect x="48.5" y="24" width="7.5" height="48" rx="3.75" fill="url(#note)"/>

    <!-- 符尾：从符干顶端向右上扬起的弧 -->
    <path d="M56 24 C 68 28, 76 38, 78 52
             C 72 42, 66 37, 56 34 Z" fill="url(#note)"/>

    <!-- 符头：倾斜的椭圆 -->
    <ellipse cx="40" cy="70.5" rx="15" ry="11.5"
             transform="rotate(-20 40 70.5)" fill="url(#note)"/>

    <!-- 装饰点 -->
    <circle cx="28" cy="38" r="3.8" fill="#6fd0e6" opacity="0.9"/>
  </g>
</svg>